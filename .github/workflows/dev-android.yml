name: Android DIY

on:
  workflow_dispatch:
    inputs:
      record:
        description: "ControlURL"
        required: false
        default: "https://hs.example.com"
        type: string


jobs:
  build:
    runs-on: ubuntu-latest

    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      # - name: Check out code
      #   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@v4

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - name: Switch to Java 17 # Note: 17 is pre-installed on ubuntu-latest
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      # Clean should essentially be a no-op, but make sure that it works.
      - name: Clean
        run: make clean

      - name: ControlURL
        run: 
          sed -i 's/<server_Address>/${{ inputs.record }}/g' android/src/main/java/com/tailscale/ipn/ui/model/IpnState.kt

      - name: Build APKs
        run: make tailscale-debug.apk

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale
          path: android/build/*.apk

      - name: Run tests
        run: make test
